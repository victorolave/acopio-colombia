name: Release

# Un release NO es un deploy. Cada push a `main` ya despliega en Vercel; esto
# pone un punto con nombre en esa línea continua, para poder responder «qué
# cambió y cuándo» y para tener un ancla de rollback legible. Las reglas de
# versionado están en docs/versionado.md.

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "Salto de versión"
        type: choice
        required: true
        default: automatico
        options:
          - automatico
          - patch
          - minor
          - major
      version:
        description: "Versión exacta (opcional; ignora el salto de arriba)"
        type: string
        required: false

  # Corte diario de datos a las 23:00 en Colombia (UTC-5). Los datos son el
  # producto: si cambiaron en el día, ese día merece quedar registrado aunque
  # el mantenedor no haya tenido tiempo de cortar el release a mano.
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publicar:
    name: Cortar release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `fetch-depth: 0` es obligatorio: sin el historial completo y sin tags,
      # no hay rango desde el último release y las notas saldrían vacías.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Comprobar si hay algo que publicar
        id: alcance
        run: |
          ultimo=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          rango=${ultimo:+$ultimo..HEAD}

          if [ -z "$(git log --oneline ${rango:-HEAD})" ]; then
            echo "No hay commits desde ${ultimo:-el inicio}. No se corta nada."
            echo "continuar=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # El corte automático solo se justifica si cambiaron los datos. El
          # manual siempre procede: el mantenedor ya decidió que vale la pena.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tocados=$(git diff --name-only ${rango:-HEAD} -- data/ supabase/seed.sql docs/sources.md)
            if [ -z "$tocados" ]; then
              echo "Hubo commits, pero ninguno tocó datos. El corte diario no aplica."
              echo "continuar=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "continuar=si" >> "$GITHUB_OUTPUT"

      # Falla a propósito si encuentra un commit marcado como ruptura y el salto
      # no se pidió como `major` a mano. Declarar que el sitio dejó de cumplir
      # una promesa pública es una decisión humana, no una deducción.
      - name: Calcular la versión
        id: version
        if: steps.alcance.outputs.continuar == 'si'
        run: |
          entrada="${{ inputs.version }}"
          tipo="${{ inputs.tipo || 'automatico' }}"

          if [ -n "$entrada" ]; then
            siguiente="${entrada#v}"
          elif [ "$tipo" = "automatico" ]; then
            siguiente=$(pnpm run --silent release:bump)
          else
            actual=$(node -p "require('./package.json').version")
            siguiente=$(pnpm dlx semver "$actual" -i "$tipo")
          fi

          echo "Versión siguiente: $siguiente"
          echo "valor=$siguiente" >> "$GITHUB_OUTPUT"

      # Se generan ANTES de tocar el árbol: salen del historial de git, no de
      # los archivos, así que no dependen del orden. Explícito para que nadie
      # las mueva después por accidente.
      - name: Generar las notas del release
        id: notas
        if: steps.alcance.outputs.continuar == 'si'
        run: |
          {
            echo "cuerpo<<FIN_DE_NOTAS"
            pnpm run --silent release:notes
            echo ""
            echo "---"
            echo ""
            echo "Reglas de versionado: [docs/versionado.md](https://github.com/${{ github.repository }}/blob/main/docs/versionado.md)"
            echo "FIN_DE_NOTAS"
          } >> "$GITHUB_OUTPUT"

      # POR QUÉ EL TAG VA SOLO, SIN EMPUJAR NADA A `main`
      #
      # `main` está protegida con comprobaciones de estado obligatorias, y eso
      # se queda como está: este repositorio acepta aportes públicos de datos y
      # esa protección es justo lo que impide que entre algo sin validar.
      #
      # `github-actions[bot]` no es administrador, así que no la salta. Un
      # commit recién creado no tiene comprobaciones aprobadas todavía —no puede
      # tenerlas—, de modo que empujarlo a `main` desde aquí sería un rechazo
      # garantizado, y encima el día que se necesite cortar un release rápido.
      #
      # Los tags NO están protegidos: la protección de rama no los cubre. Así
      # que el tag y el release salen de inmediato sobre un commit que YA pasó
      # el CI, y el CHANGELOG viaja aparte en un pull request.
      - name: Publicar el tag y el release
        if: steps.alcance.outputs.continuar == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.valor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "${{ steps.notas.outputs.cuerpo }}"

      # El release ya está publicado; esto solo mantiene el historial del
      # repositorio en sintonía. Que espere a una revisión no bloquea nada.
      - name: Abrir el pull request con el CHANGELOG
        if: steps.alcance.outputs.continuar == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.valor }}
        run: |
          rama="chore/changelog-v$VERSION"
          git checkout -b "$rama"

          # EL ORDEN IMPORTA, y costó un release descubrirlo.
          #
          # `pnpm version` comprueba que el árbol esté limpio antes de tocar
          # nada, incluso con `--no-git-tag-version`. Al revés que aquí —que es
          # como estaba— el paso anterior acababa de reescribir CHANGELOG.md, así
          # que pnpm se plantaba con ERR_PNPM_UNCLEAN_WORKING_TREE.
          #
          # Estuvo tapado detrás del fallo de `ultimoTag()`, que cortaba la
          # ejecución antes de llegar hasta aquí. En cuanto se arregló aquel,
          # v1.8.0 destapó este: dos bugs apilados en el mismo paso.
          pnpm version "$VERSION" --no-git-tag-version
          pnpm run --silent release:notes -- --insertar "$VERSION"

          git add CHANGELOG.md package.json
          git commit -m "chore(release): registrar v$VERSION en el CHANGELOG"
          git push origin "$rama"

          # El cuerpo va por archivo y no en línea: dentro de un bloque YAML
          # la indentación se colaría literal en el texto, y diez espacios al
          # principio de una línea Markdown la convierten en bloque de código.
          cat > /tmp/cuerpo-pr.md <<CUERPO
          El release [v$VERSION](https://github.com/${{ github.repository }}/releases/tag/v$VERSION) ya está publicado. Esto solo deja el CHANGELOG y \`package.json\` al día en el repositorio.

          Generado por el workflow de release. Las reglas están en [docs/versionado.md](https://github.com/${{ github.repository }}/blob/main/docs/versionado.md).
          CUERPO
          sed -i 's/^          //' /tmp/cuerpo-pr.md

          gh pr create \
            --title "chore(release): registrar v$VERSION en el CHANGELOG" \
            --body-file /tmp/cuerpo-pr.md \
            --base main \
            --head "$rama"
