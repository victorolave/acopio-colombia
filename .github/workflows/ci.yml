name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: este workflow solo lee el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, datos y build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # pnpm se instala ANTES que Node a propósito: `setup-node` necesita que
      # pnpm ya exista para poder cachear su almacén. La versión no se escribe
      # aquí, sale del campo `packageManager` de package.json, que es la única
      # respuesta a «con qué se instala esto».
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `--frozen-lockfile` hace fallar el CI si package.json y pnpm-lock.yaml
      # no concuerdan, en vez de resolver por su cuenta y desplegar un árbol de
      # dependencias que nadie probó.
      - run: pnpm install --frozen-lockfile

      # Se ejecuta PRIMERO y a propósito: si un pull request introduce un centro
      # con fuente anterior al terremoto, o marca «verified» algo que solo tiene
      # respaldo de prensa, queremos que falle aquí y no en la revisión humana.
      - name: Validar las reglas de verificación del seed
        run: pnpm run validate:seed

      - name: Comprobar tipos
        run: pnpm run typecheck

      # Se añade a CI el mismo día que ESLint se instaló de verdad. El proyecto
      # llevaba desde el primer commit con `"lint": "next lint"` sin ESLint en las
      # dependencias: el comando fallaba, nadie lo corría y las reglas de React se
      # dejaron de cumplir en silencio. Si no se ejecuta aquí, vuelve a pasar.
      - name: Reglas de estilo y de React
        run: pnpm run lint

      # El build corre SIN credenciales de Supabase, a propósito: comprueba que
      # el respaldo con el seed estático sigue funcionando. Es lo que mantiene el
      # sitio en pie si la base de datos falla durante la emergencia.
      - name: Build sin base de datos (modo respaldo)
        run: pnpm run build
        env:
          # La convocatoria de voluntarios no se renderiza sin esta variable, y
          # las pruebas de interacción la necesitan en pantalla. Va aquí porque
          # `NEXT_PUBLIC_*` se incrusta en tiempo de BUILD, no de arranque.
          #
          # Es una URL FALSA a propósito. El CI solo tiene que comprobar que el
          # componente se monta, que el enlace sale con `target="_blank"` y que
          # el texto dice lo que prometemos; para nada de eso hace falta el
          # formulario real, y así la URL de producción no entra al repositorio.
          # La de verdad vive en las variables de entorno del despliegue.
          NEXT_PUBLIC_VOLUNTEER_FORM_URL: https://example.com/formulario-de-voluntarios

      # Pruebas de interacción real en navegador. Existen porque el rediseño
      # móvil salió con dos botones muertos: el typecheck pasaba, el build
      # pasaba y el HTML era correcto. Un manejador de gestos se interponía
      # entre el dedo y el botón e impedía que se generara el `click`.
      - name: Instalar Chromium para las pruebas de interacción
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas de interacción (móvil y escritorio)
        run: pnpm run test:e2e

      - name: Guardar el rastro si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # El seed generado tiene que corresponder con data/centers.ts. Si alguien
      # editó supabase/seed.sql a mano, o cambió los datos sin regenerarlo, aquí
      # se nota.
      - name: Verificar que el seed generado esté al día
        run: |
          pnpm run seed:build
          if ! git diff --quiet -- supabase/seed.sql; then
            echo "::error::supabase/seed.sql está desactualizado respecto a data/centers.ts."
            echo "Ejecuta 'pnpm run seed:build' e incluye el resultado en el commit."
            git diff --stat -- supabase/seed.sql
            exit 1
          fi
          echo "El seed generado coincide con data/centers.ts."
